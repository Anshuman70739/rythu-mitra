name: Integrate Rythu Mitra bundle

on:
  push:
    branches:
      - "integration/complete-model-bundle-20261018"
    paths:
      - "RythuMitra_Complete_Integrated.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rythu-mitra-bundle-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/complete-model-bundle-20261018
          fetch-depth: 0

      - name: Validate uploaded package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RythuMitra_Complete_Integrated.zip"
          test -f "$ZIP" || { echo "::error::Upload $ZIP to this branch first."; exit 1; }
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q 'RythuMitra_Complete_Integrated/run.py'
          unzip -l "$ZIP" | grep -q 'RythuMitra_Complete_Integrated/rythu_mitra_backend/__init__.py'
          unzip -l "$ZIP" | grep -q 'RythuMitra_Complete_Integrated/templates/rythu_mitra.html'
          unzip -l "$ZIP" | grep -q 'RythuMitra_Complete_Integrated/static/js/rythu-mitra-app.js'
          unzip -l "$ZIP" | grep -q 'RythuMitra_Complete_Integrated/models/crop_model.pkl'
          unzip -l "$ZIP" | grep -q 'RythuMitra_Complete_Integrated/models/plant_disease_model.h5'

      - name: Replace tracked project files from the approved package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RythuMitra_Complete_Integrated.zip"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$ZIP" -d "$TMP"
          SRC="$TMP/RythuMitra_Complete_Integrated"
          test -f "$SRC/run.py"
          test -f "$SRC/backend.py"
          test -f "$SRC/rythu_mitra_backend/__init__.py"
          test -f "$SRC/templates/rythu_mitra.html"
          test -f "$SRC/static/js/rythu-mitra-app.js"
          test -f "$SRC/models/crop_model.pkl"
          test -f "$SRC/models/plant_disease_model.h5"

          # Keep Git metadata, this workflow, local secrets, databases, uploads,
          # and any genuine disease-label mapping that may already exist.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='instance/' \
            --exclude='data/disease_labels.json' \
            --exclude='data/*.db*' \
            --exclude='uploads/*' \
            --exclude="$ZIP" \
            "$SRC"/ ./

          rm -f "$ZIP"

      - name: Run archive-independent source checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app.py backend.py run.py rythu_mitra_backend scripts tests train_model.py
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("static/locales/en.json"),
              Path("static/locales/te.json"),
              Path("static/data/resource-config.json"),
              Path("models/MODEL_ASSET_MANIFEST.json"),
              Path("data/disease_labels.template.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON OK: {path}")

          required = (
              "templates/rythu_mitra.html",
              "templates/privacy_policy.html",
              "templates/terms_and_conditions.html",
              "static/js/rythu-mitra-app.js",
              "models/crop_model.pkl",
              "models/plant_disease_model.h5",
              "data/DISEASE_LABELS_REQUIRED.md",
          )
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit("Missing required paths: " + ", ".join(missing))
          print("Required frontend, backend, model, and label-instructions paths exist.")
          PY

      - name: Commit integrated files to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Integrate complete Rythu Mitra frontend backend and models"
          git push origin HEAD:integration/complete-model-bundle-20261018
