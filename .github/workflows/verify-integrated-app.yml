name: Verify integrated Rythu Mitra

on:
  push:
    branches:
      - main
      - "integration/complete-model-bundle-20261018"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-rythu-mitra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py backend.py run.py rythu_mitra_backend scripts tests train_model.py

      - name: Verify required files and JSON data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json_files = [
              Path("static/locales/en.json"),
              Path("static/locales/te.json"),
              Path("static/data/resource-config.json"),
              Path("models/MODEL_ASSET_MANIFEST.json"),
              Path("data/disease_labels.template.json"),
          ]
          for path in json_files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON OK: {path}")

          required = [
              "templates/rythu_mitra.html",
              "templates/landing.html",
              "templates/privacy_policy.html",
              "templates/terms_and_conditions.html",
              "static/js/rythu-mitra-app.js",
              "static/js/monsoon-atlas.js",
              "static/css/monsoon-atlas.css",
              "models/crop_model.pkl",
              "models/plant_disease_model.h5",
              "data/DISEASE_LABELS_REQUIRED.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing required paths: " + ", ".join(missing))
          print("Required app and model paths exist.")
          PY

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: |
          node --check static/js/rythu-mitra-app.js
          node --check static/js/monsoon-atlas.js
          node --check static/js/monsoon-atlas-cinematic.js
          node --check static/js/monsoon-atlas-experience.js
          node --check static/js/monsoon-atlas-signature.js

      - name: Start Flask and smoke-test core HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          export HOST=127.0.0.1
          export PORT=5000
          python run.py > "$RUNNER_TEMP/rythu-mitra-flask.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rythu-mitra-flask.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/rythu-mitra-flask.log"
            echo "Flask did not become healthy within 30 seconds."
            exit 1
          fi

          python - <<'PY'
          import json
          from urllib.request import urlopen

          base = "http://127.0.0.1:5000"
          paths = [
              "/", "/app", "/health", "/ready", "/api/session", "/privacy-policy",
              "/terms-and-conditions", "/about", "/features", "/architecture", "/static/favicon.svg",
              "/static/css/monsoon-atlas.css", "/static/js/monsoon-atlas.js",
              "/static/css/monsoon-atlas-cinematic.css", "/static/js/monsoon-atlas-cinematic.js",
              "/static/css/monsoon-atlas-workspace.css", "/static/css/monsoon-atlas-signature.css",
              "/static/js/monsoon-atlas-experience.js", "/static/js/monsoon-atlas-signature.js",
          ]
          for path in paths:
              with urlopen(base + path, timeout=5) as response:
                  status = response.status
                  body = response.read()
                  content_type = response.headers.get("Content-Type", "")
              if status != 200 or not body:
                  raise SystemExit(f"FAIL {path}: HTTP {status}, empty_body={not body}")
              if path == "/" and (
                  "text/html" not in content_type
                  or b"A clearer path" not in body
              ):
                  raise SystemExit("Public Monsoon Atlas landing page did not return expected HTML.")
              if path == "/app" and (
                  "text/html" not in content_type
                  or b"Rythu Mitra | Farmer decision support" not in body
              ):
                  raise SystemExit("Existing farmer workspace did not return expected HTML.")
              if path == "/api/session":
                  session_data = json.loads(body)
                  if not session_data.get("csrf_token"):
                      raise SystemExit("Session endpoint did not return a CSRF token.")
              if path in {"/health", "/ready"}:
                  payload = json.loads(body)
                  expected = "ok" if path == "/health" else "ready"
                  if payload.get("status") != expected:
                      raise SystemExit(f"{path} status was not {expected!r}: {payload}")
              if path in {"/about", "/features", "/architecture"} and "text/html" not in content_type:
                  raise SystemExit(f"Expected an HTML showcase page at {path}.")
              print(f"PASS {path}: HTTP {status} ({content_type})")
          PY
