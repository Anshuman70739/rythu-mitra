name: Verify integrated Rythu Mitra

on:
  push:
    branches:
      - "integration/complete-model-bundle-20261018"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-rythu-mitra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py backend.py run.py rythu_mitra_backend scripts tests train_model.py

      - name: Verify required files and JSON data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json_files = [
              Path("static/locales/en.json"),
              Path("static/locales/te.json"),
              Path("static/data/resource-config.json"),
              Path("models/MODEL_ASSET_MANIFEST.json"),
              Path("data/disease_labels.template.json"),
          ]
          for path in json_files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON OK: {path}")

          required = [
              "templates/rythu_mitra.html",
              "templates/privacy_policy.html",
              "templates/terms_and_conditions.html",
              "static/js/rythu-mitra-app.js",
              "models/crop_model.pkl",
              "models/plant_disease_model.h5",
              "data/DISEASE_LABELS_REQUIRED.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing required paths: " + ", ".join(missing))
          print("Required app and model paths exist.")
          PY

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: node --check static/js/rythu-mitra-app.js
